name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Integration tests (real Postgres + Redis)
        run: pytest tests/integration -v

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

  iac-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Trivy config scan (Terraform + K8s manifests)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0" # flip to "1" once you've triaged findings
      - name: Checkov (Terraform + Kubernetes + Dockerfile + workflows)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          soft_fail: true # report findings without blocking; tighten later
          quiet: true

  build-scan:
    needs: [lint-test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: urlshort:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: urlshort:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save urlshort:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar, retention-days: 1 }

  e2e-kind:
    needs: [build-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image }
      - uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - name: Load image and deploy with kustomize
        run: |
          kind load image-archive image.tar --name ci
          cd k8s/base
          kustomize edit set image urlshort=urlshort:ci
          kubectl apply -k .
      - name: Wait for rollout
        run: |
          kubectl -n urlshort rollout status statefulset/postgres --timeout=180s
          kubectl -n urlshort rollout status deployment/redis --timeout=120s
          kubectl -n urlshort rollout status deployment/urlshort --timeout=180s
      - name: Smoke and load test
        run: |
          kubectl -n urlshort port-forward svc/urlshort 8080:80 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          
          # Poll until readyz is reachable (up to 30s)
          for _i in $(seq 30); do
            if curl -fsS localhost:8080/readyz; then break; else sleep 1; fi
          done
          
          CODE=$(curl -fsS -X POST localhost:8080/api/v1/links \
            -H 'content-type: application/json' -d '{"url":"https://example.com"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["code"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/"$CODE")" = "307"
          curl -fsS localhost:8080/api/v1/links/"$CODE"/stats
          docker run --rm --network host -v "$PWD/scripts:/scripts:ro" \
            -e BASE_URL=http://localhost:8080 grafana/k6:0.55.0 run /scripts/loadtest.js
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n urlshort get pods -o wide
          kubectl -n urlshort describe pods
          kubectl -n urlshort logs -l app=urlshort --tail=100

  publish:
    if: github.event_name == 'push'
    needs: [e2e-kind, iac-and-manifests, prometheus-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lower case IMAGE
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
